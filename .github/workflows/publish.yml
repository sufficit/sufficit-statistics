name: Publish Packages

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      SRC_DIR: ./src
      NUPKGS_DIR: ${{ github.workspace }}/nupkgs

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5

    - name: Setup .NET Environment
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: |
          7.0.x
          9.0.x
          10.0.x

    - name: Restore
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet restore

    - name: Build
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet build --configuration Release --no-restore

    - name: Pack
      working-directory: ${{ env.SRC_DIR }}
      run: dotnet pack --configuration Release --no-build --output ${{ env.NUPKGS_DIR }}

    - name: Publish to Nuget.Org
      env:
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
      run: |
        if [ -z "$NUGET_API_KEY" ]; then
          echo "NUGET_API_KEY secret not configured; skipping publish."
          exit 0
        fi
        dotnet nuget push --skip-duplicate "$NUPKGS_DIR"/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY"
