name: Metrics queue validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            7.0.x
            9.0.x
            10.0.x
      - run: dotnet build src/Sufficit.Statistics.csproj
      - run: dotnet run --project tests/QueueTests.csproj
